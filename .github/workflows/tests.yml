# Runs the decision-engine tests on every push and pull request.
# The engine decides every percentage the app shows, so a silent change
# to its scoring is the most damaging thing that could reach production.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Decision engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install — the tests use only the Node standard library.
      - name: Run engine tests
        run: node tests/engine.test.mjs
